name: Lint and format

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main: stacked branches must be checked too.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-format:
    name: Python formatting (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip "ruff==0.17.1"
      # The formatter is pinned so the baseline stays reproducible; dependabot
      # raises the pin. The committed [tool.ruff] section fixes line length and
      # quote style.
      - name: Check formatting
        run: ruff format --check zt_dsp_py

  rust-format:
    name: Rust formatting (rustfmt + clippy)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/rs-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Check formatting
        run: cargo fmt --manifest-path zt_dsp_rs/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path zt_dsp_rs/Cargo.toml --all-targets -- -D warnings