# Publishing pipeline: manual start, second-person approval, draft only.
#
# A maintainer starts this workflow from Actions -> Release -> Run workflow and
# supplies an existing client-v* tag. The github-release job waits on the
# `release` environment, whose required reviewers are the two maintainers; the
# person who started the run cannot approve it. The job creates a draft release.
# A maintainer publishes it after review.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example client-v1.0.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  dist:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build ./isostress_py --outdir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  exe:
    name: Build Windows one-file executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -e ./isostress_py
          pyinstaller --onefile --name isostress_py isostress_py/__main__.py
      - name: Smoke test
        run: dist/isostress_py.exe --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: exe
          path: dist/isostress_py.exe

  github-release:
    name: Create draft GitHub Release
    needs: [dist, exe]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: exe
          path: dist
      - name: Attach license texts and third-party notices
        run: |
          # The wheel and sdist already carry LICENSE; the one-file executable does not.
          # Ship the license texts and third-party notices alongside every release asset.
          cp LICENSE LICENSING.md THIRD-PARTY-NOTICES.md dist/
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          # The tag prefix used to be enforced by the `push: tags: ["client-v*"]`
          # trigger. A free-text input enforces nothing, so the constraint lives here.
          case "$TAG" in
            client-v*) ;;
            *) echo "not a client-v* tag: $TAG" >&2; exit 1 ;;
          esac
          # Re-running the workflow for a tag that already has a release (for example after the
          # tag was moved) must replace it instead of failing with "release already exists".
          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || true
          gh release create "$TAG" \
            --title "isostress client $TAG" \
            --generate-notes \
            --verify-tag \
            --draft \
            dist/*
