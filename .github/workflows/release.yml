# Publishing pipeline: manual start, second-person approval, draft only.
#
# A maintainer starts this workflow from Actions -> Release -> Run workflow,
# selects main, and supplies an existing client-v* tag plus the same tag again
# as confirmation. The preflight job refuses a tag that is missing, not on
# main, or not matching the built package version. The github-release job waits
# on the `release` environment, whose required reviewers are the two
# maintainers; the person who started the run cannot approve it. The job
# creates a draft release. A maintainer publishes it after review. A published
# release is never replaced automatically. No workflow in this repository
# triggers on a tag push; self-check check 18 enforces that.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example client-v1.0.1"
        required: true
        type: string
      confirm:
        description: "Type the same tag again to confirm"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-client
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Check source, confirmation, and tag shape
        env:
          TAG: ${{ inputs.tag }}
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          test "$REF" = "refs/heads/main" || {
            echo "run this workflow from main, got $REF" >&2; exit 1; }
          test "$CONFIRM" = "$TAG" || {
            echo "confirmation does not match tag" >&2; exit 1; }
          case "$TAG" in
            client-v*) ;;
            *) echo "not a client-v* tag: $TAG" >&2; exit 1 ;;
          esac
      - name: Check tag exists and is on main
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git fetch origin main --tags --force
          git rev-parse --verify "refs/tags/$TAG" >/dev/null || {
            echo "tag does not exist: $TAG" >&2; exit 1; }
          git merge-base --is-ancestor "$TAG^{commit}" origin/main || {
            echo "tag commit is not on main: $TAG" >&2; exit 1; }

  dist:
    name: Build distributions
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build ./isostress_py --outdir dist
      - name: Check version matches tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python -m pip install -e ./isostress_py
          OUT=$(python -m isostress_py --version)
          WANT="ISOSTRESS_PY-${TAG#client-v}"
          case "$OUT" in
            "$WANT"|"$WANT"-*) ;;
            *) echo "version $OUT does not match $TAG" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  exe:
    name: Build Windows one-file executable
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -e ./isostress_py
          pyinstaller --onefile --name isostress_py isostress_py/__main__.py
      - name: Smoke test
        env:
          TAG: ${{ inputs.tag }}
        run: |
          OUT=$(dist/isostress_py.exe --version)
          WANT="ISOSTRESS_PY-${TAG#client-v}"
          case "$OUT" in
            "$WANT"|"$WANT"-*) ;;
            *) echo "version $OUT does not match $TAG" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: exe
          path: dist/isostress_py.exe

  github-release:
    name: Create draft GitHub Release
    needs: [preflight, dist, exe]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: exe
          path: dist
      - name: Attach license texts and third-party notices
        run: |
          # The wheel and sdist already carry LICENSE; the one-file executable does not.
          # Ship the license texts and third-party notices alongside every release asset.
          cp LICENSE LICENSING.md THIRD-PARTY-NOTICES.md dist/
      - name: Refuse to replace a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --json isDraft --jq '.isDraft' >/tmp/isdraft 2>/dev/null; then
            if [ "$(cat /tmp/isdraft)" != "true" ]; then
              echo "release $TAG is already published; refusing to replace it" >&2
              exit 1
            fi
            gh release delete "$TAG" --yes --cleanup-tag=false
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "isostress client $TAG" \
            --generate-notes \
            --verify-tag \
            --draft \
            dist/*
