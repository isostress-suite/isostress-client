# Continuous integration: the gate that every pull request must pass.
#
# Every action is pinned to a commit SHA (not a movable tag): this repository ships a
# security protocol, so an upstream tag being retargeted must not silently change what
# runs here. The comment after each pin records the human-readable version.
name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main: stacked branches must be checked too.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # One Windows leg only. The library is platform-neutral, so running
          # four Windows legs costs runner minutes without testing anything
          # the Linux legs do not already cover. Newest is the one worth keeping.
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./zt_dsp_py
          python -m pip install pytest pytest-cov

      - name: Version banner
        run: python -m zt_dsp_py --version

      - name: Test with coverage
        run: >
          python -m pytest zt_dsp_py/tests -q
          --cov=zt_dsp_py --cov-report=term --cov-report=xml:coverage.xml
          --junitxml=junit.xml

      - name: Non-interactive startup must not hang (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m zt_dsp_py < /dev/null > /tmp/zt-dsp-usage.txt
          grep -qi "usage:" /tmp/zt-dsp-usage.txt

      - name: Job summary
        if: always()
        run: python scripts/ci_summary.py junit.xml coverage.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: ignore

  package:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build
        # Proves the packaging layout actually produces an installable artifact.
        run: |
          python -m pip install --upgrade pip build
          python -m build ./zt_dsp_py --outdir dist
      - name: Verify the wheel installs and runs
        run: |
          python -m pip install dist/*.whl
          python -m zt_dsp_py --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  rust:
    name: Rust implementation
    runs-on: ubuntu-latest
    # Pin the target directory to an ASCII path. Cargo fails when the working directory
    # contains non-ASCII characters (a real trap on a Chinese Windows path).
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/rs-target
    defaults:
      run:
        working-directory: zt_dsp_rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # ubuntu-latest images ship a stable Rust toolchain; no third-party action needed.
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release
  interop:
    name: Live handshake interop (Python <-> Rust, both directions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # This job proves the two implementations complete a real four-phase handshake and
    # exchange messages over loopback. It is NOT a byte-level conformance check --
    # byte-level equality is proven by the shared known-answer vectors
    # (test-vectors/vectors.json), which both sides assert in their own test suites.
    # Neither this job nor the per-language suites can detect a wire divergence on
    # their own. Do not delete it to "speed up CI".
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the Python implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./zt_dsp_py

      - name: Build the Rust peer
        working-directory: zt_dsp_rs
        run: cargo build --release

      - name: Interop suite, both directions
        working-directory: zt_dsp_rs
        run: python interop_test.py --rust-bin target/release/zt-dsp-rs --suite interop

