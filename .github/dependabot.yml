# Keep dependencies patched. One entry per ecosystem present in the repository.
#
# The pip directory is `/isostress_py`, NOT `/isostress`: the package was renamed and the
# manifest moved inside the package directory during the 1.0.0 rebuild. A stale
# directory here is silently useless -- Dependabot reports success while scanning
# a path that does not exist. Verified against isostress_py/pyproject.toml.
#
# Version-update proposals are off (open-pull-requests-limit: 0 in every
# entry): the weekly proposals kept arriving as pull requests, and robot
# pull requests are not merged by policy. The pins move only when a
# maintainer applies the change in a signed commit. Alert-driven security
# fixes stay governed by the repository security settings, not by this file.
version: 2

updates:
  - package-ecosystem: pip
    directory: /isostress_py
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: [dependencies, python]

  - package-ecosystem: cargo
    directory: /isostress_rs
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: [dependencies, rust]
    ignore:
      # sha3 0.12 does not implement the CoreProxy trait from digest 0.11, so
      # hmac 0.13 cannot wrap it: Hmac<Sha3_256> fails to compile. sha2 0.11
      # and hmac 0.13 do pair with each other, so the three crates move
      # together or not at all. Drop these rules when sha3 supports the trait.
      - dependency-name: sha3
        update-types: ["version-update:semver-major"]
      - dependency-name: sha2
        update-types: ["version-update:semver-major"]
      - dependency-name: hmac
        update-types: ["version-update:semver-major"]

  # CI actions are pinned to commit SHAs (see ci.yml header), so Dependabot updating
  # the version comment matters as much as the SHA itself.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: [dependencies, ci]