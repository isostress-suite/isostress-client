# cargo-fuzz manifest.
#
# A separate workspace: cargo-fuzz builds with nightly and its own sanitizer flags,
# and mixing that into the release build would change what CI actually ships.
#
# The library target (isostress_rs) is what this fuzzes -- before the [lib] target was
# added, the crate was bin-only and could not be linked from a fuzz target at all.
[package]
name = "isostress-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "AGPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.isostress-rs]
path = "../isostress_rs"

[[bin]]
name = "frames"
path = "frames.rs"
test = false
doc = false
bench = false