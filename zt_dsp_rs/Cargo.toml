[package]
name = "zt-dsp-rs"
version = "1.0.0"
edition = "2021"
description = "ZT-DSP_RS-1.0.0 — reference Rust implementation of the ZT-DSP protocol (follows the ZT-DSP Protocol Master Guide, docs 1.0.2)"
license = "AGPL-3.0-or-later"

# The crate is both a library and a binary. The library target is what makes the
# protocol usable as a dependency and lets fuzz/ (cargo-fuzz needs `use
# <crate>::...`) link against it; the binary target is the CLI.
[lib]
name = "zt_dsp_rs"
path = "lib.rs"

[[bin]]
name = "zt-dsp-rs"
path = "zt-dsp-rs.rs"

[dependencies]
x25519-dalek = "3"
# The three crates below move together or not at all: sha3 0.12 does not
# implement the CoreProxy trait from digest 0.11, so hmac 0.13 cannot wrap
# it and Hmac<Sha3_256> fails to compile; sha2 0.11 and hmac 0.13 pair with
# each other. Raise the three pins as one set.
sha3 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.11"
aes = "0.9"
subtle = "2"
zeroize = { version = "1.9", features = ["derive"] }
rand = "0.10"
getrandom = "0.4"
serde_json = "1"
hex = "0.4"
base64 = "0.23"
socket2 = "0.5"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
